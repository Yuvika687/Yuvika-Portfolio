<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="Yuvika Malhotra — AI/ML Engineer. B.Tech CSE at Lovely Professional University. Portfolio live at yuvika.vercel.app.">
<defs>
  <radialGradient id="bg" cx="70%" cy="40%" r="80%"><stop offset="0" stop-color="#1B0B3D"/><stop offset=".45" stop-color="#0A0618"/><stop offset="1" stop-color="#04030C"/></radialGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#7C3AED" stop-opacity=".75"/><stop offset=".55" stop-color="#6D28D9" stop-opacity=".22"/><stop offset="1" stop-color="#6D28D9" stop-opacity="0"/></radialGradient>
