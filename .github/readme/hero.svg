  <linearGradient id="flip" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C026D3"/><stop offset=".5" stop-color="#F43F5E"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
