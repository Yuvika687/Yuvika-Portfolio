  <clipPath id="frame"><rect width="1280" height="460" rx="24"/></clipPath>
  <clipPath id="wclip"><rect x="0" y="-36" height="48" width="0"><animate attributeName="width" dur="12s" repeatCount="indefinite" values="0;420;420;0;0;420;420;0;0;420;420;0;0;420;420;0" keyTimes="0.0000;0.0350;0.2150;0.2500;0.2500;0.2850;0.4650;0.5000;0.5000;0.5350;0.7150;0.7500;0.7500;0.7850;0.9650;1.0000"/></rect></clipPath>
  <style>
    .s{font-family:'Outfit','Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
    .m{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
    .tw{fill:#fff;animation:tw 4.5s ease-in-out infinite} @keyframes tw{0%,100%{opacity:.15}50%{opacity:.95}}
    .spin{transform-origin:960px 190px;animation:spin 18s linear infinite} .spinR{transform-origin:960px 190px;animation:spin 30s linear infinite reverse}
    @keyframes spin{to{transform:rotate(360deg)}}
    .breath{transform-origin:960px 190px;animation:br 5s ease-in-out infinite} @keyframes br{50%{transform:scale(1.08);opacity:.8}}
    .shimmer{animation:sh 3.6s ease-in-out infinite} @keyframes sh{50%{opacity:.55}}
    .rise{animation:rise 1s cubic-bezier(.2,.8,.2,1) both} @keyframes rise{from{opacity:0;transform:translateY(14px)}}
    .caret{animation:caret 1s steps(1) infinite} @keyframes caret{50%{opacity:0}}
    .dot{animation:dot 1.8s ease-in-out infinite} @keyframes dot{50%{opacity:.3}}
  </style>
</defs>
