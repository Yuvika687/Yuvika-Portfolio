"1160" cy="128" r="8" fill="#8B5CF6" class="pulse"/><text x="1190" y="168" text-anchor="end" class="m" font-size="12" letter-spacing="2" fill="#8B5CF6">2023 — NOW  ● PURSUING</text><text x="1190" y="198" text-anchor="end" class="s" font-size="19" font-weight="800" fill="#fff">B.Tech · Computer Science &amp; Engineering</text><text x="1190" y="224" text-anchor="end" class="s" font-size="14.5" font-weight="600" fill="#ECEBFA" opacity=".85">Lovely Professional University</text><text x="1190" y="248" text-anchor="end" class="m" font-size="11.5" fill="#A9A8C8">AI/ML · Data Structures · Software Engineering</text></g>
