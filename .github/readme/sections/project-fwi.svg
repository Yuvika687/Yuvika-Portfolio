<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-label="FWI Weather Predictor: Forest Fire Weather Index regression. 2 regression models. Stack: Pandas, NumPy, scikit-learn.">
<defs>
  <radialGradient id="bg" cx="30%" cy="0%" r="110%"><stop offset="0" stop-color="#160A33"/><stop offset=".55" stop-color="#08061A"/><stop offset="1" stop-color="#04030C"/></radialGradient>
  <radialGradient id="gl" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FBBF24" stop-opacity=".35"/><stop offset="1" stop-color="#FBBF24" stop-opacity="0"/></radialGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A78BFA" stop-opacity=".55"/><stop offset=".5" stop-color="#6366F1" stop-opacity=".15"/><stop offset="1" stop-color="#22D3EE" stop-opacity=".5"/></linearGradient>
  <linearGradient id="vc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".55" stop-color="#6366F1"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C026D3"/><stop offset=".5" stop-color="#F43F5E"/><stop offset="1" stop-color="#FBBF24"/></linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".028"/></pattern>
  <clipPath id="fr"><rect width="620" height="300" rx="22"/></clipPath>
  <style>
.s{font-family:'Inter','Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.m{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}
.tw{fill:#fff;animation:tw 4.5s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.1}50%{opacity:.85}}
.rise{animation:rise .9s cubic-bezier(.2,.8,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.9);opacity:0}}
.blink{animation:blink 1.8s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}
.grow{transform-box:fill-box;transform-origin:0 50%;animation:grow 1.6s cubic-bezier(.2,.8,.2,1) both}@keyframes grow{from{transform:scaleX(0)}}
.draw{animation:draw 2.2s cubic-bezier(.4,0,.2,1) both}@keyframes draw{from{stroke-dashoffset:var(--len)}}
.sweep{animation:sweep 5s linear infinite}@keyframes sweep{to{stroke-dashoffset:-1000}}
.scan{animation:scan 6s ease-in-out infinite}@keyframes scan{0%,100%{transform:translateX(-40%)}50%{transform:translateX(140%)}}
</style>
</defs>
<g clip-path="url(#fr)">
  <rect width="620" height="300" fill="url(#bg)"/><rect width="620" height="300" fill="url(#grid)"/>
  <ellipse cx="496" cy="45" rx="217" ry="180" fill="url(#gl)"/>
  <circle class="tw" cx="113" cy="273" r="0.8" style="animation-delay:1.1s"/><circle class="tw" cx="265" cy="153" r="0.6" style="animation-delay:2.6s"/><circle class="tw" cx="314" cy="242" r="1.2" style="animation-delay:1.6s"/><circle class="tw" cx="125" cy="138" r="0.8" style="animation-delay:3.5s"/><circle class="tw" cx="327" cy="187" r="1" style="animation-delay:1.4s"/><circle class="tw" cx="532" cy="80" r="0.8" style="animation-delay:2.2s"/><circle class="tw" cx="285" cy="88" r="0.6" style="animation-delay:2.6s"/><circle class="tw" cx="129" cy="176" r="0.6" style="animation-delay:0.3s"/><circle class="tw" cx="213" cy="199" r="1.2" style="animation-delay:2.3s"/><circle class="tw" cx="453" cy="52" r="0.6" style="animation-delay:2.3s"/><circle class="tw" cx="376" cy="96" r="0.6" style="animation-delay:3.0s"/><circle class="tw" cx="502" cy="267" r="0.8" style="animation-delay:1.1s"/><circle class="tw" cx="227" cy="252" r="1" style="animation-delay:2.0s"/><circle class="tw" cx="108" cy="66" r="0.6" style="animation-delay:1.1s"/>
  <rect x="0" y="0" width="620" height="4" fill="#FBBF24"/><rect x="1" y="1" width="618" height="298" rx="21" fill="none" stroke="#FBBF24" stroke-width="1.6" stroke-dasharray="90 1100" class="sweep"/><text x="30" y="52" class="m" font-size="13" fill="#FBBF24">04 /</text><rect x="557" y="34" width="33" height="22" rx="11" fill="#FBBF24" fill-opacity=".1" stroke="#FBBF24" stroke-opacity=".45"/><text x="567" y="50.0" class="m" font-size="10.5" fill="#FBBF24">ML</text><text x="30" y="92" class="s" font-size="27" font-weight="800" letter-spacing="-.4" fill="#fff">FWI Weather Predictor</text><text x="30" y="118" class="s" font-size="14.5" fill="#A9A8C8">Forest Fire Weather Index regression</text><rect x="30" y="140" width="190" height="96" rx="14" fill="#FBBF24" fill-opacity=".08" stroke="#FBBF24" stroke-opacity=".3"/><text x="48" y="190" class="s" font-size="38" font-weight="800" fill="#FBBF24">2</text><text x="48" y="218" class="m" font-size="11" fill="#A9A8C8">regression models</text><text x="244" y="168" class="s" font-size="13.5" fill="#ECEBFA" opacity=".9"><tspan fill="#FBBF24">▸ </tspan>EDA, outlier handling, feature transforms</text><text x="244" y="196" class="s" font-size="13.5" fill="#ECEBFA" opacity=".9"><tspan fill="#FBBF24">▸ </tspan>Linear &amp; Ridge regression pipeline</text><rect x="244" y="210" width="61" height="23" rx="12" fill="#FBBF24" fill-opacity=".1" stroke="#FBBF24" stroke-opacity=".45"/><text x="254" y="226.5" class="m" font-size="11" fill="#FBBF24">Pandas</text><rect x="313" y="210" width="54" height="23" rx="12" fill="#FBBF24" fill-opacity=".1" stroke="#FBBF24" stroke-opacity=".45"/><text x="323" y="226.5" class="m" font-size="11" fill="#FBBF24">NumPy</text><rect x="375" y="210" width="102" height="23" rx="12" fill="#FBBF24" fill-opacity=".1" stroke="#FBBF24" stroke-opacity=".45"/><text x="385" y="226.5" class="m" font-size="11" fill="#FBBF24">scikit-learn</text><text x="30" y="272" class="m" font-size="12" fill="#C4B5FD">Yuvika687/FWI-Predictor <tspan fill="#FBBF24">→</tspan></text>
  <g class="scan"><rect x="0" y="0" width="155" height="300" fill="url(#shine)"/></g>
</g>
<rect x=".5" y=".5" width="619" height="299" rx="22" fill="none" stroke="url(#rim)"/>
</svg>
