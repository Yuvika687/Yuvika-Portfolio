<svg xmlns="http://www.w3.org/2000/svg" width="620" height="300" viewBox="0 0 620 300" role="img" aria-label="Anti-Spoof Attendance: Mask-aware liveness gate for face attendance. 98.69% accuracy · 1.31% HTER. Stack: PyTorch, OpenCV, MediaPipe, ONNX.">
<defs>
