<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-label="Built with semantic HTML, about 2,500 lines of CSS and 16 vanilla JavaScript modules: stars, particles, neural backdrop, globe, cursor, parallax, tilt, glow cards, flip words, counters, scroll reveals, timelines, project stack, certificates and main.">
