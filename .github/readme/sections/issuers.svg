".45"/><circle cx="366" cy="126" r="4" fill="#F43F5E" class="blink" style="animation-delay:1.5s"/><text x="379" y="131" class="s" font-size="13" font-weight="600" fill="#ECEBFA">Postman</text></g><g class="rise" style="animation-delay:0.46s"><rect x="456" y="110" width="131" height="32" rx="16" fill="#0B0920" stroke="#22C55E" stroke-opacity=".45"/><circle cx="473" cy="126" r="4" fill="#22C55E" class="blink" style="animation-delay:1.8s"/><text x="486" y="131" class="s" font-size="13" font-weight="600" fill="#ECEBFA">freeCodeCamp</text></g><g class="rise" style="animation-delay:0.52s"><rect x="600" y="110" width="80" height="32" rx="16" fill="#0B0920" stroke="#8B5CF6" stroke-opacity=".45"/><circle cx="617" cy="126" r="4" fill="#8B5CF6" class="blink" style="animation-delay:2.1s"/><text x="630" y="131" class="s" font-size="13" font-weight="600" fill="#ECEBFA">GSSoC</text></g><g class="rise" style="animation-delay:0.58s"><rect x="692" y="110" width="88" height="32" rx="16" fill="#0B0920" stroke="#60A5FA" stroke-opacity=".45"/><circle cx="709" cy="126" r="4" fill="#60A5FA" class="blink" style="animation-delay:2.4s"/><text x="722" y="131" class="s" font-size="13" font-weight="600" fill="#ECEBFA">Unstop</text></g><g class="rise" style="animation-delay:0.64s"><rect x="792" y="110" width="139" height="32" rx="16" fill="#0B0920" stroke="#FBBF24" stroke-opacity=".45"/><circle cx="809" cy="126" r="4" fill="#FBBF24" class="blink" style="animation-delay:2.7s"/><text x="822" y="131" class="s" font-size="13" font-weight="600" fill="#ECEBFA">CSE Pathshala</text></g>
  <g class="scan"><rect x="0" y="0" width="320" height="168" fill="url(#shine)"/></g>
</g>
<rect x=".5" y=".5" width="1279" height="167" rx="22" fill="none" stroke="url(#rim)"/>
</svg>
